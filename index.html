<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="フチ付け">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111827">
  <title>PhotoFrame Studio - 一括写真フチ付けアプリ</title>
  
  <!-- 外部 manifest.json を直接指定（書き換えなし） -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * { -webkit-tap-highlight-color: transparent; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans CJK JP", sans-serif;
      overscroll-behavior-y: none;
    }
    .bg-checkerboard {
      background-color: #18181b;
      background-image: 
        linear-gradient(45deg, #27272a 25%, transparent 25%), 
        linear-gradient(-45deg, #27272a 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #27272a 75%), 
        linear-gradient(-45deg, transparent 75%, #27272a 75%);
      background-size: 20px 20px;
      background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    input[type="range"] { accent-color: #3b82f6; }

    .workspace-layout { display: flex; flex-direction: column; }
    .control-sidebar { max-height: 45dvh; width: 100%; border-top: 1px solid #1f2937; }

    @media (orientation: landscape), (min-width: 640px) {
      .workspace-layout { flex-direction: row; }
      .control-sidebar { max-height: none; height: 100%; width: 360px; border-top: none; border-left: 1px solid #1f2937; }
    }
    @media (min-width: 960px) {
      .control-sidebar { width: 400px; }
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 h-dvh flex flex-col overflow-hidden">

  <header class="bg-gray-900/95 backdrop-blur border-b border-gray-800 px-4 py-2 flex items-center justify-between shrink-0 z-20">
    <div class="flex items-center gap-2">
      <div class="w-6 h-6 rounded-md bg-white p-1 flex items-center justify-center shadow">
        <div class="w-full h-full bg-gray-900 rounded-xs"></div>
      </div>
      <h1 class="font-bold text-sm sm:text-base tracking-tight">PhotoFrame <span class="text-[11px] font-normal text-blue-400 bg-blue-950/80 border border-blue-800 px-1.5 py-0.5 rounded">Studio</span></h1>
    </div>

    <div class="flex items-center gap-2">
      <!-- アイコン画像がリポジトリに無い時だけ表示されるアイコン生成ボタン -->
      <button id="downloadIconsBtn" class="hidden bg-amber-600 hover:bg-amber-500 active:scale-95 transition text-xs font-semibold px-2.5 py-1.5 rounded-lg flex items-center gap-1 shadow">
        <i data-lucide="file-down" class="w-3.5 h-3.5"></i>
        <span>PWA用アイコンDL</span>
      </button>

      <!-- PWAインストールボタン（対応環境で自動表示） -->
      <button id="installAppBtn" class="hidden bg-emerald-600 hover:bg-emerald-500 active:scale-95 transition text-xs font-semibold px-2.5 py-1.5 rounded-lg flex items-center gap-1 shadow">
        <i data-lucide="smartphone" class="w-3.5 h-3.5"></i>
        <span>インストール</span>
      </button>

      <label for="fileInput" class="cursor-pointer bg-gray-800 hover:bg-gray-700 active:scale-95 transition text-xs font-medium px-3 py-1.5 rounded-lg flex items-center gap-1.5 border border-gray-700">
        <i data-lucide="image-plus" class="w-4 h-4 text-blue-400"></i>
        <span>写真を追加</span>
      </label>
      <input id="fileInput" type="file" accept="image/*" multiple class="hidden">

      <button id="exportBtn" disabled class="bg-blue-600 hover:bg-blue-500 disabled:bg-gray-800 disabled:text-gray-500 active:scale-95 transition text-xs font-semibold px-3.5 py-1.5 rounded-lg flex items-center gap-1.5 shadow-lg shadow-blue-900/20">
        <i data-lucide="download" class="w-4 h-4"></i>
        <span id="exportBtnText">一括保存</span>
      </button>
    </div>
  </header>

  <div class="workspace-layout flex-1 min-h-0 min-w-0 overflow-hidden">

    <main class="flex-1 flex flex-col min-h-0 min-w-0 relative bg-checkerboard">
      
      <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center p-6 z-10 bg-gray-950/90 backdrop-blur-sm">
        <label for="fileInput" class="w-full max-w-md border-2 border-dashed border-gray-700 hover:border-blue-500 rounded-2xl p-8 flex flex-col items-center justify-center text-center cursor-pointer transition bg-gray-900/60 hover:bg-gray-900">
          <div class="w-14 h-14 rounded-full bg-blue-500/10 border border-blue-500/30 flex items-center justify-center mb-3 text-blue-400">
            <i data-lucide="images" class="w-7 h-7"></i>
          </div>
          <p class="text-base font-bold text-white mb-1">写真をタップして選択（複数可）</p>
          <p class="text-xs text-gray-400 mb-4">元の比率を保ったまま、等しい距離で綺麗なフチをつけます</p>
          <span class="bg-blue-600 text-white text-xs font-semibold px-5 py-2.5 rounded-xl shadow">カメラロール・フォルダから選ぶ</span>
        </label>
      </div>

      <div id="previewContainer" class="flex-1 flex items-center justify-center p-4 sm:p-6 min-h-0 min-w-0 relative overflow-hidden">
        <canvas id="previewCanvas" class="max-w-full max-h-full object-contain shadow-2xl transition-opacity duration-150"></canvas>
        
        <div id="imageInfoBadge" class="hidden absolute top-2.5 left-2.5 bg-gray-900/80 backdrop-blur border border-gray-700/80 text-[11px] text-gray-300 px-2.5 py-1 rounded-md flex items-center gap-2">
          <span id="infoResolution">-- × --</span>
          <span class="text-gray-600">|</span>
          <span id="infoIndex">1 / 1</span>
        </div>

        <button id="clearAllBtn" class="hidden absolute top-2.5 right-2.5 bg-gray-900/80 hover:bg-red-950/90 text-gray-400 hover:text-red-300 backdrop-blur border border-gray-700/80 text-[11px] px-2.5 py-1 rounded-md flex items-center gap-1 transition">
          <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          <span>すべてクリア</span>
        </button>
      </div>

      <div id="thumbnailBar" class="hidden bg-gray-900/95 border-t border-gray-800 px-3 py-1.5 shrink-0">
        <div id="thumbnailList" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-0.5"></div>
      </div>
    </main>

    <section class="control-sidebar bg-gray-900 shrink-0 z-20 flex flex-col">
      <div class="grid grid-cols-3 border-b border-gray-800 text-xs font-semibold bg-gray-950/50 shrink-0">
        <button data-tab="color" class="tab-btn py-2.5 flex items-center justify-center gap-1 border-b-2 border-blue-500 text-blue-400 bg-gray-900/60">
          <i data-lucide="palette" class="w-3.5 h-3.5"></i>
          <span>色・抽出</span>
        </button>
        <button data-tab="blur" class="tab-btn py-2.5 flex items-center justify-center gap-1 border-b-2 border-transparent text-gray-400 hover:text-gray-200">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
          <span>写真ぼかし</span>
        </button>
        <button data-tab="size" class="tab-btn py-2.5 flex items-center justify-center gap-1 border-b-2 border-transparent text-gray-400 hover:text-gray-200">
          <i data-lucide="sliders" class="w-3.5 h-3.5"></i>
          <span>比率・角・影</span>
        </button>
      </div>

      <div class="p-3.5 overflow-y-auto space-y-3.5 text-xs flex-1">
        <div class="bg-gray-800/60 border border-gray-800 rounded-xl p-3">
          <div class="flex justify-between items-center mb-1.5">
            <span class="font-semibold text-gray-200 flex items-center gap-1.5">
              <i data-lucide="maximize-2" class="w-3.5 h-3.5 text-blue-400"></i>
              フチの太さ（等距離）
            </span>
            <span id="borderWidthLabel" class="font-mono text-blue-400 font-bold">8%</span>
          </div>
          <input id="borderWidthSlider" type="range" min="0" max="35" step="0.5" value="8" class="w-full h-2 bg-gray-700 rounded-lg cursor-pointer">
        </div>

        <div id="tab-color" class="tab-panel space-y-3.5">
          <div class="space-y-2">
            <span class="text-gray-400 font-medium block">定番カラー & 自由選択</span>
            <div class="flex items-center justify-between bg-gray-950/50 border border-gray-800/80 rounded-xl p-2.5">
              <button data-color="#FFFFFF" class="preset-color-btn w-7 h-7 rounded-full bg-white border-2 border-blue-500 shadow ring-2 ring-blue-500/40" title="白 (#FFFFFF)"></button>
              <button data-color="#F8FAFC" class="preset-color-btn w-7 h-7 rounded-full bg-slate-100 border border-gray-600" title="オフホワイト"></button>
              <button data-color="#E5E5E5" class="preset-color-btn w-7 h-7 rounded-full bg-neutral-200 border border-gray-600" title="ライトグレー"></button>
              <button data-color="#18181B" class="preset-color-btn w-7 h-7 rounded-full bg-zinc-900 border border-gray-600" title="ダークグレー"></button>
              <button data-color="#000000" class="preset-color-btn w-7 h-7 rounded-full bg-black border border-gray-600" title="黒 (#000000)"></button>
              
              <label class="relative flex items-center justify-center w-8 h-8 rounded-full bg-gradient-to-tr from-pink-500 via-yellow-400 to-cyan-400 p-0.5 cursor-pointer shadow">
                <span class="w-full h-full rounded-full bg-gray-900 flex items-center justify-center">
                  <i data-lucide="pipette" class="w-3.5 h-3.5 text-white"></i>
                </span>
                <input id="customColorPicker" type="color" value="#ffffff" class="sr-only">
              </label>
            </div>
          </div>

          <div class="bg-gray-950/60 border border-gray-800/80 rounded-xl p-3 space-y-2.5">
            <div class="flex items-center justify-between gap-1">
              <span class="text-gray-300 font-medium flex items-center gap-1.5">
                <i data-lucide="wand-2" class="w-3.5 h-3.5 text-amber-400"></i>
                写真から抽出した5色
              </span>
            </div>
            
            <div id="extractedPaletteContainer" class="grid grid-cols-5 gap-1.5 pt-0.5">
              <p class="col-span-5 text-gray-500 text-[11px] py-1">写真を読み込むと自動で5色を抽出します</p>
            </div>

            <label class="flex items-center gap-2 text-[11px] text-gray-400 cursor-pointer pt-1 border-t border-gray-800/80">
              <input id="autoPerPhotoToggle" type="checkbox" checked class="rounded bg-gray-800 border-gray-700 text-blue-500 focus:ring-0">
              <span>一括保存時も各写真ごとの抽出色を使う</span>
            </label>
          </div>
        </div>

        <div id="tab-blur" class="tab-panel hidden space-y-3">
          <div class="flex items-center justify-between bg-blue-950/40 border border-blue-800/50 rounded-xl px-3 py-2.5">
            <div>
              <p class="font-semibold text-blue-200">背景ぼかしフチモード</p>
              <p class="text-[11px] text-blue-300/80">写真自身を拡大してぼかした背景をフチにします</p>
            </div>
            <span class="bg-blue-600 text-white font-semibold px-2.5 py-1 rounded-lg text-[11px] shrink-0">適用中</span>
          </div>

          <div class="space-y-2.5">
            <div class="bg-gray-800/50 p-3 rounded-xl border border-gray-800">
              <div class="flex justify-between mb-1.
